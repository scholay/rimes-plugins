name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license and documentation
        run: python3 scripts/check_repository.py

      - name: Check commit whitespace
        run: git show --format= --check HEAD

      - name: Test package validation and reproducible source bundles
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Test Linux translation resources and incremental ownership
        run: |
          python3 native/linux/translation/test_runtime.py
          g++ -std=c++17 -Wall -Wextra -Werror native/linux/translation/units.cpp native/linux/translation/units_tests.cpp -o /tmp/translation-units
          /tmp/translation-units

      - name: Build plugin artifacts
        run: python3 scripts/packages.py

      - name: Check out pinned host JSON headers for portable codec validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: scholay/xsime
          ref: cbd5f9db51a77419ecd7882eda6f18dbb309bb0c
          path: .ci-host
          sparse-checkout: platforms/windows/native/third_party/nlohmann
          persist-credentials: false

      - name: Test portable OpenAI stream contract
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -I .ci-host/platforms/windows/native/third_party \
            native/shared/openai/chat_codec.cpp native/shared/openai/chat_codec_tests.cpp -o /tmp/ai-codec
          /tmp/ai-codec

      - name: Upload candidate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-plugins-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check license and documentation
        run: python3 scripts/check_repository.py

      - name: Check commit whitespace
        run: git show --format= --check HEAD

      - name: Test package validation and reproducible source bundles
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Build plugin artifacts
        run: python3 scripts/packages.py

      - name: Upload candidate packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-plugins-${{ github.sha }}
          path: dist/
          retention-days: 14
          if-no-files-found: error
